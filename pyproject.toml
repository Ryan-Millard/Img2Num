[project]
name = "img2num"
dynamic = ["version"] # derived via [[tool.dynamic-metadata]] below
description = "A fast and accurate raster image to SVG conversion library"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "packages/py/README.md"
authors = [{ name = "Ryan Millard" }]
dependencies = [
  "numpy>=1.23.5"
]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Scientific/Engineering :: Image Processing"
]

[project.urls]
Homepage      = "https://img2num.dev"
Repository    = "https://github.com/Ryan-Millard/Img2Num"
Documentation = "https://img2num.dev/docs/"
Changelog     = "https://img2num.dev/changelog/py/"
"Changelog (GitHub)" = "https://github.com/Ryan-Millard/Img2Num/blob/main/packages/py/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Ryan-Millard/Img2Num/issues"
Funding       = "https://github.com/sponsors/Ryan-Millard"

[build-system]
requires = [
  "scikit-build-core>=1.0",
  "pybind11>=2.10",
  "numpy>=2.0",
  "pybind11-stubgen>=2.5.5,<3",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
cmake.args = [
  "-DIMG2NUM_BUILD_PYTHON=ON",
  "-DIMG2NUM_BUILD_EXAMPLES=OFF",
]
wheel.packages = ["img2num"]
sdist.inclusion-mode = "explicit"
sdist.include = [
  "pyproject.toml",
  "LICENSE",
  "CMakeLists.txt",
  "core/**",
  "bindings/py/**",
  "packages/py/**",
  "third_party/dawn/**",
  "third_party/spdlog/**",
]
sdist.exclude = [
  # Local build output; explicit mode does not read .gitignore, so these
  # must be excluded here.
  "packages/py/build/",
  "packages/py/build-py/",
  "third_party/dawn/webgpu-cts/",
  # WebGPU CTS GN metadata: 43 MB test_list.txt + 8 MB cache tarball.
  "third_party/dawn/third_party/gn/",
  # Opt-in macOS toolchain dir (per its README); contains the tree's only
  # dangling symlink (ranlib -> libtool).
  "third_party/dawn/src/cmake/HermeticXcode/",
  "third_party/**/.git",
  "third_party/**/.github/",
  "third_party/**/build/",
  "third_party/**/test/",
  "third_party/**/tests/",
  "third_party/**/testing/",
  "third_party/**/bench/",
  "third_party/**/example/",
  "third_party/**/scripts/",
  "third_party/**/logos/",
]
wheel.license-files = [
  "LICENSE",
  "third_party/spdlog/LICENSE",
  "third_party/dawn/**/*LICENSE*",
]

# Derive version from version definition in packages/py/pyproject.toml
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "packages/py/pyproject.toml"
regex = '^version = "(?P<value>[^"]+)"'

[tool.uv]
package = true

[tool.uv.workspace]
members = [
  # All example apps with "-py" suffix
  "example-apps/*-py"
]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["third_party/", "docs/", ".venv/"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "B",   # flake8-bugbear (mutable defaults, bare excepts, etc.)
  "UP",  # pyupgrade — modernise syntax
  "SIM", # flake8-simplify
]
# ruff obeys .gitignore by default
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"] # Allow re-exports in __init__.py

[tool.cibuildwheel]
build-verbosity = 1

[dependency-groups]
dev = [
    "docspec>=2.2.1,<3",
    "docspec-python>=2.2.1,<3",
    "pybind11-stubgen>=2.5.5,<3",
    "pydoc-markdown>=4.8.2,<5",
    "ruff>=0.15,<0.16",
]
