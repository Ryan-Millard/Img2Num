[project]
name = "img2num_dev_scripts"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
  "clang-tidy==22.1.8",
  "clang-format==22.1.8",
]

[project.scripts]
lint_cpp = "lint_cpp:main"
format_cpp = "format_cpp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "lint_cpp.py",
    "format_cpp.py",
    "img2num_root.py",
]
