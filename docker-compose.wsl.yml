# WSL2 GPU override, layered on top of docker-compose.yml + docker-compose.gpu.yml by `img2num.ps1 --gpu ...`
# (and therefore `img2num.bat --gpu ...`) on Windows, and by `./img2num --gpu ...` when run inside WSL2.
#
# WSL2 has no native NVIDIA Linux driver; the GPU is exposed through the DirectX kernel interface (/dev/dxg)
# and the user-space libraries in /usr/lib/wsl/lib (libdxcore.so, libd3d12.so, libcuda.so, ...).
# These paths refer to Docker Desktop's WSL2 VM, not the Windows filesystem.
services:
  dev:
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
    environment:
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      # NVIDIA ships no Linux Vulkan driver for WSL2, so the fallback /etc/vulkan/icd.d/nvidia_icd.json from
      # Dockerfile-gpu.dev points at a missing libGLX_nvidia.so.0 and the loader warns on every instance creation.
      # Restrict the loader to Mesa's drivers (llvmpipe/lavapipe software Vulkan) to avoid that.
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d
