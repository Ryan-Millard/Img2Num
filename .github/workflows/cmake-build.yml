name: Build C & C++

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      run-tests:
        description: 'Build and run the C++ core and C bindings tests'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-wasm:
    name: Build WASM (bindings/js)
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true

      - name: Run emcmake
        run: emcmake cmake -DCMAKE_BUILD_TYPE=Release -B build-wasm/ .

      - name: Build using Emscripten
        run: cmake --build build-wasm/

      - name: Upload WASM build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wasm-build
          path: packages/js/build-wasm/
          if-no-files-found: error

  build-c-cpp:
    name: Build C & C++
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true

      - name: Check toolchain
        run: |
          cmake --version
          clang --version

      - name: Run cmake
        run: cmake -DIMG2NUM_BUILD_TESTS=${{ inputs.run-tests && 'ON' || 'OFF' }} -B build-c-cpp/ .

      - name: Build C/C++
        run: cmake --build build-c-cpp/

      - name: Run C/C++ tests
        if: ${{ inputs.run-tests }}
        run: ctest --test-dir build-c-cpp/ --output-on-failure

      - name: Upload C/C++ build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-c-cpp
          path: build-c-cpp/
          if-no-files-found: error

  build-py:
    name: Build Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true

      - name: Set current image
        run: |
          echo "IMG2NUM_IMAGE=${{ inputs.image }}" >> $GITHUB_ENV

      - name: Debug Image
        run: echo "$IMG2NUM_IMAGE"

      - name: Check toolchain
        run: |
          ./img2num run cmake --version
          ./img2num run clang --version

      - name: Run uv sync
        run: ./img2num run uv sync

      - name: Build wheel
        run: |
          ./img2num run uv build
          # Debug
          ls -R dist || true

      - name: Verify import
        run: ./img2num run uv run python3 -c "import img2num;"

      - name: Test native Python bindings
        run: ./img2num run just py test

      - name: Build and run example-apps/console-py
        # Uses an image that is guaranteed to exist
        run: ./img2num run uv run --package console-py dev docs/static/img/favicon.png

      - name: Upload Python build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: py-build
          path: dist/
          if-no-files-found: error

      - name: Upload example-apps/console-py output artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: console-py-output
          path: console-py_outputs/
          if-no-files-found: error
