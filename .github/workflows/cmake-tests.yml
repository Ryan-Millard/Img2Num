name: Test C++ Core

on:
  workflow_call:
    inputs:
      os:
        description: 'JSON array of operating systems to run tests on'
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
        required: false
      ref:
        description: 'Git revision or tag to test (defaults to github.sha)'
        type: string
        default: ''
        required: false

permissions:
  contents: read

jobs:
  core-cpp-tests:
    name: Core C++ tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: false
          persist-credentials: false

      - name: Checkout Catch2 test submodule
        run: git submodule update --init third_party/tests

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.46.0'

      - name: Run core C++ tests
        shell: bash
        run: just cmake test
