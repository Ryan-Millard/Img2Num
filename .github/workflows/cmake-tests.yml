name: Test C++ Core

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker image to run tests in'
        required: true
        type: string
      ref:
        description: 'Git revision or tag to test (defaults to github.sha)'
        type: string
        default: ''
        required: false

permissions:
  contents: read

jobs:
  core-cpp-tests:
    name: Core C++ tests
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: false
          persist-credentials: false

      - name: Checkout Catch2 test submodule
        run: git submodule update --init third_party/tests

      - name: Run core C++ tests
        run: just cmake test
