name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: read

jobs:
  benchmark-corpus:
    name: Verify benchmark corpus
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.13.0

      - name: Install Python tooling
        run: uv sync --only-group dev --no-install-project

      - name: Run corpus manager tests
        run: uv run --no-sync python -m pytest -q tests/test_corpus_manager.py

      - name: Verify corpus metadata
        run: uv run --no-sync python scripts/corpus_manager.py verify

      - name: Restore benchmark image cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/img2num-bench
          key: img2num-bench-${{ hashFiles('benchmarks/images/*.toml') }}

      - name: Fetch and verify benchmark image hashes
        if: ${{ hashFiles('benchmarks/images/*.toml') != '' }}
        run: |
          uv run --no-sync python scripts/corpus_manager.py fetch
          uv run --no-sync python scripts/corpus_manager.py verify --hashes

  set-image:
    name: Set Docker image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set.outputs.image }}
    steps:
      - name: Set image
        id: set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_IMAGE="ghcr.io/ryan-millard/img2num-dev"

          MAIN_IMAGE="${BASE_IMAGE}:main"
          DEV_IMAGE="${BASE_IMAGE}:dev"

          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Try PR image first (highest priority)
          if [[ -n "$PR_NUMBER" ]]; then
            PR_TAG="pr-${PR_NUMBER}"
            GHCR_IMAGE="ghcr.io/ryan-millard/img2num-dev:${PR_TAG}"
            DH_IMAGE="ryan-millard/img2num-dev:${PR_TAG}"

            GHCR_IMAGE_EXISTS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              /users/ryan-millard/packages/container/img2num-dev/versions \
              --jq "any(.metadata.container.tags[]? == \"${PR_TAG}\")")

            DH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 2 --max-time 5 \
              "https://registry.hub.docker.com/v2/repositories/ryan-millard/img2num-dev/tags/${PR_TAG}/")
          else
            GHCR_IMAGE_EXISTS="false"
            DH_STATUS="404"
          fi

          if [[ "$GHCR_IMAGE_EXISTS" == "true" ]]; then
            echo "image=${GHCR_IMAGE}" >> $GITHUB_OUTPUT
            echo "image=${GHCR_IMAGE}"
          elif [[ "$DH_STATUS" == "200" ]]; then
            echo "image=${DH_IMAGE}" >> $GITHUB_OUTPUT
            echo "image=${DH_IMAGE}"
          else
            # Fallback: main/dev (never PR ref names)
            BRANCH="${{ github.ref_name }}"

            case "$BRANCH" in
              main)
                IMAGE="$MAIN_IMAGE"
                ;;
              dev|*)
                IMAGE="$DEV_IMAGE"
                ;;
            esac

            echo "image=${IMAGE}" >> $GITHUB_OUTPUT
            echo "Using fallback image: ${IMAGE}"
          fi

  lint:
    name: Lint & Validate Code
    needs: [set-image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.set-image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: true

      - name: Install PNPM dependencies
        run: pnpm install
        
      - name: Build and test TypeScript types (packages/js)
        working-directory: packages/js
        run: |
          pnpm build:types
          pnpm test:types

      - name: Sync Python tooling (skip building img2num)
        run: uv sync --only-group lint

      - name: Lint Py (ruff)
        run: uv run --no-sync ruff check .

      - name: Lint JS (ESLint)
        run: pnpm run lint:js

      # TODO: uncomment the below when #607 is fixed (https://github.com/Ryan-Millard/Img2Num/issues/607)
      #- name: Lint C and C++ (clang-tidy)
        #run: pnpm run lint:cpp

      - name: Validate format
        run: pnpm run format:check

      - name: Validate .editorconfig adherance
        run: pnpm run editorconfig:check

      - name: Validate scriptsInfo in package.json
        run: pnpm run validate-scripts

  cmake-build:
    name: Build C/C++
    uses: ./.github/workflows/cmake-build.yml
    needs: [set-image]
    with:
      image: ${{ needs.set-image.outputs.image }}

  # Docs now builds react app internally
  build-docs:
    name: Build Documentation Site
    uses: ./.github/workflows/build-docs.yml
    needs: [set-image, cmake-build]
    with:
      image: ${{ needs.set-image.outputs.image }}
      wasm-artifacts-path: packages/js/build-wasm/
    secrets:
      ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
      ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
      ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
