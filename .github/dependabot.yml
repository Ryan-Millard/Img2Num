version: 2
updates:
  # ======================================================================
  # Root workspace (tooling, linting, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "dev"
    groups:
      all-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "npm"
      - "root"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # JS package
  - package-ecosystem: "npm"
    directory: "/packages/js"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "dev"
    groups:
      all-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "npm"
      - "package:js"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # Example apps
  - package-ecosystem: "npm"
    directory: "/example-apps"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "dev"
    groups:
      all-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "npm"
      - "javascript"
      - "example-app"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # Docs (Docusaurus)
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "dev"
    groups:
      all-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0" # typedoc-plugin-markdown doesn't support v7
    labels:
      - "dependencies"
      - "npm"
      - "docs"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # ======================================================================
  # Root workspace
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "dev"
    groups:
      all-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"
      - "uv"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

    # Python tooling
  - package-ecosystem: "uv"
    directory: "/scripts/py"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "dev"
    groups:
      all-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"
      - "uv"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # Example apps
  - package-ecosystem: "uv"
    directory: "/example-apps"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "dev"
    groups:
      all-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"
      - "uv"
      - "example-app"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # ======================================================================
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "dev"
    groups:
      all-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"

  # ======================================================================
  # Git Submodules
  - package-ecosystem: "gitsubmodule"
    directory: "/third_party"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "git-submodule"
      - "c/cpp"
      - "core"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(submodules)"

