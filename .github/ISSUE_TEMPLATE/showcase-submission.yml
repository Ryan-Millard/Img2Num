name: Showcase submission
description: Submit a project built with Img2Num for consideration in the community showcase.
title: "[Showcase]: "
body:
  - type: input
    id: project_name
    attributes:
      label: Project name
      placeholder: My Img2Num project
    validations:
      required: true

  - type: input
    id: project_url
    attributes:
      label: Live project URL
      description: A publicly reachable URL for the project.
      placeholder: https://example.com
    validations:
      required: true

  - type: input
    id: repository_url
    attributes:
      label: Source repository
      description: Link to the public source repository.
      placeholder: https://github.com/username/repository
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Briefly describe what the project does and how it uses Img2Num.
    validations:
      required: true

  - type: dropdown
    id: binding
    attributes:
      label: Img2Num binding used
      options:
        - JavaScript
        - Python
        - C
        - C++
    validations:
      required: true

  - type: input
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional link to a screenshot or preview image.
      placeholder: https://example.com/screenshot.png

  - type: checkboxes
    id: criteria
    attributes:
      label: Listing criteria
      options:
        - label: I confirm that this project uses Img2Num, is publicly reachable, and is not unlawful, NSFW, or spammy. I understand that maintainers may decline or remove entries at their discretion.
          required: true
