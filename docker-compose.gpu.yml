# GPU override for docker-compose.yml. Used by `./img2num --gpu ...`.
# Requires the NVIDIA Container Toolkit on the host:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
services:
  dev:
    # No GPU image is published; default to the one built by `./img2num build --gpu`.
    # If that image doesn't exist yet, Compose builds it from Dockerfile-gpu.dev (pull_policy: missing),
    # layered on IMG2NUM_BASE_IMAGE (the Dockerfile.dev image).
    image: ${IMG2NUM_IMAGE:-img2num-dev:gpu}
    pull_policy: ${IMG2NUM_PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: Dockerfile-gpu.dev
      args:
        IMG2NUM_BASE_IMAGE: ${IMG2NUM_BASE_IMAGE:-ryanmillard/img2num-dev:latest}
        BUILD_DATE: ${BUILD_DATE:-}
        GIT_SHA: ${GIT_SHA:-}
    environment:
      IMG2NUM_IMAGE: ${IMG2NUM_IMAGE:-img2num-dev:gpu}
      NVIDIA_VISIBLE_DEVICES: all
      # "graphics" is required for the Vulkan/EGL driver libraries Dawn uses.
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, graphics, utility]
